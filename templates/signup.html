{% extends "base.html" %}

{% block title %}Sign up · Nook{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Create your Nook</h1>
  {% if let Some(msg) = error %}
  <p class="flash flash-error">{{ msg }}</p>
  {% endif %}
  <form method="post" action="/signup" class="stack">
    <label>Name
      <input type="text" name="display_name" required autofocus>
    </label>
    <label>Email
      <input type="email" name="email" required>
    </label>
    <label>Password
      <input type="password" name="password" required minlength="8">
    </label>
    <fieldset class="mode-choice">
      <legend>I'm mostly organizing</legend>
      <label class="radio"><input type="radio" name="mode" value="student" checked> School — subjects</label>
      <label class="radio"><input type="radio" name="mode" value="work"> Work — projects</label>
    </fieldset>
    <button type="submit">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="/login">Log in</a></p>
</section>
{% endblock %}
