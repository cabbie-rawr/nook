[package]
name = "nook"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# web
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "compression-br", "limit"] }
tower-cookies = "0.10"

# templates (server-rendered, HTMX on the client)
askama = { version = "0.12", default-features = false, features = ["with-axum"] }
askama_axum = "0.4"

# database
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "chrono", "migrate"] }

# auth
argon2 = "0.5"
rand = "0.8"

# time
chrono = { version = "0.4", features = ["serde"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# misc
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "chrono", "migrate", "macros"] }
