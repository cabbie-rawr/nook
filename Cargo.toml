[package]
name = "nook"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# web
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "compression-br", "limit"] }
tower-cookies = "0.10"

# templates (server-rendered, HTMX on the client)
askama = { version = "0.12", default-features = false, features = ["with-axum"] }
askama_axum = "0.4"

# database — Supabase Postgres. `uuid` + `json` let sqlx bind/decode Uuid
# columns (auth.users ids) and jsonb (user_layout.layout) directly.
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "json", "migrate"] }

# auth — Supabase Auth (GoTrue) over HTTP; JWTs it issues are verified locally
# via the project's JWT secret (HS256) rather than a round-trip per request.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
jsonwebtoken = "9"
# OAuth (Google/GitHub via Supabase) uses PKCE — sha2/base64 compute the
# code_challenge from a random code_verifier; no client secret ever touches
# this app, that lives in Supabase's own provider config.
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# time
chrono = { version = "0.4", features = ["serde"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# misc
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "json", "migrate", "macros"] }
